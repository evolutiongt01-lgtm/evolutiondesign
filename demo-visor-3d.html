<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evolution 3D Viewer · Demo</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    padding:48px 18px;
    background:#050506;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  }
  .wrap{width:min(960px,100%);margin:auto}
  .kicker{color:#d4b895;font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
  h1{font-size:clamp(2rem,6vw,4.7rem);line-height:.95;letter-spacing:-.06em;margin:12px 0 15px;max-width:820px}
  p{color:#8d8d94;line-height:1.65;max-width:680px}
  .viewer{margin-top:32px}
  code{color:#d4b895}
</style>
<script src="./evolution-3d.js" defer></script>
</head>
<body>
  <main class="wrap">
    <div class="kicker">Evolution Design · 3D Delivery</div>
    <h1>Explora el proyecto desde cualquier ángulo.</h1>
    <p>Demo del visor independiente. Sustituye el <code>src</code> por tu archivo GLB de arquitectura y el <code>poster</code> por el render del proyecto.</p>

    <div class="viewer"
      data-evolution-model="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      data-title="Proyecto · Vista 3D"
      data-subtitle="Orbit · Zoom · Cámaras · AR">
    </div>
  </main>
</body>
</html>
